[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha-lab"
version = "0.1.2-alpha"
description = "A High-performance And Standard Alpha Factor Mining System"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "huangbogeng", email = "huangbogeng@outlook.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "polars>=1.39.2",
    "pandas>=3.0.0",
    "clickhouse-driver>=0.2.6",
    "pyarrow>=23.0.0",
    "numpy>=2.4.0",
    "joblib>=1.3.0",
    "loguru>=0.7.0",
    "sqlparse>=0.5.5",
    "dynaconf>=3.2.13",
    "pytest>=9.0.0",
    "rich>=14.3.3",
    "varname>=0.15.1",
    "toolz>=1.1.0",
    "polars_ds>=0.11.0",
    "ipywidgets>=8.1.8",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["."]
include = ["tool_box*", "blazestore*", "datacenter*", "factor*", "alpha_master*"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long, handled by black
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
